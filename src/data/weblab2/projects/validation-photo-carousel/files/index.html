<!DOCTYPE html>
<html>
  <head>
    <title>Photo Carousel</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="topbar">
      <div id="avatar"></div>
      <h3 id="brand">PhotoFeed</h3>
    </div>

    <div id="post">
      <img id="photo1" src="photo1.png" alt="A scenic coastline at sunset" width="300">
      <img id="photo2" src="photo2.png" alt="A pine forest trail with tall trees" width="300">

      <div id="actions">
        <button id="next">Next</button>
      </div>

      <p id="caption">Sunset on the coast</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
